name: Build APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '_incoming/skate-build.txt'
      - '.github/workflows/android.yml'
      - 'monodeco_gen_7_v7.5.0.mcaddon'
      - 'tools/deco_import.py'
      - 'tools/deco/registry.json'
  workflow_run:
    workflows: ["Unpack and commit", "Reverter atualização"]
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Instalar dependencias do importador monoDeco
        run: python3 -m pip install --user Pillow numpy

      - name: Importar monoDeco completo
        run: python3 tools/deco_import.py monodeco_gen_7_v7.5.0.mcaddon --batches 1,2,3,4

      - name: Salvar recursos importados no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/resources/deco tools/deco/registry.json
          if ! git diff --cached --quiet; then
            git commit -m "Importar recursos monoDeco no catalogo do CuboLand"
            git push
          else
            echo "Os recursos gerados ja estao atualizados."
          fi

      - name: Validar catalogo de decoracao
        run: python3 tools/deco_validate.py

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CuboLand.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CuboLand-APK
          path: CuboLand.apk

      - name: Publicar versao (o app baixa daqui)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: CuboLand v${{ github.run_number }}
          files: CuboLand.apk
          make_latest: true
